<h3 mat-dialog-title class="titulo">Eliminar</h3>
<mat-dialog-content>
  <p>¿Esta seguro de eliminar?</p>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-raised-button mat-dialog-close color="primary">No</button>
  <button mat-raised-button [mat-dialog-close]="true" color="warn">Si</button>
</mat-dialog-actions>
